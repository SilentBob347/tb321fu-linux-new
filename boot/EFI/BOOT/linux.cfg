# TB321FU Linux Boot Configuration
# Loaded dynamically by QCOMRAMP.EFI

set timeout=2
set default=0
set gfxpayload=keep

menuentry "TB321FU Linux (USB SSD / Internal root)" {
    search --no-floppy --file /Image --set=root
    devicetree /dtb/platform.dtb
    if [ -f /initramfs.cpio.gz ]; then
        echo "Loading initramfs..."
        initrddirect /initramfs.cpio.gz
    fi
    echo "Booting Linux kernel..."
    linuxdirect /Image root=PARTLABEL=tb321fu-root rw rootwait drm_client_lib.active=none
}

menuentry "TB321FU Linux (Force USB SSD: tb321fu-root-usb)" {
    search --no-floppy --file /Image --set=root
    devicetree /dtb/platform.dtb
    if [ -f /initramfs.cpio.gz ]; then
        initrddirect /initramfs.cpio.gz
    fi
    linuxdirect /Image root=PARTLABEL=tb321fu-root-usb rw rootwait drm_client_lib.active=none
}

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
